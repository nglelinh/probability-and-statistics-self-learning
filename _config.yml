# Setup
title:               "Probability and Statistics Self-Learning"
description:         "A bilingual Probability & Statistics / computational statistics course. Vietnamese is complete (Ch. 01–08); English currently covers Chapter 01."
url:                 https://nglelinh.github.io
baseurl:             '/probability-and-statistics-self-learning'
imgurl:              https://nglelinh.github.io/probability-and-statistics-self-learning/img
paginate:            5
permalink:           pretty

# Multi-language support
languages:           ["en", "vi"]
default_lang:        "en"
exclude_from_localization: ["javascript", "images", "css", "public"]
parallel_localization: true

# Language-specific configurations
t:
  en:
    title: "Probability and Statistics Self-Learning"
    description: "Computational statistics: simulation, inference, and data-driven reasoning. English track starts at Chapter 01; Chapters 02–08 are still Vietnamese-only."
    home: "Home"
    chapters: "Chapters"
    language: "Language"
    switch_language: "Switch to Vietnamese"
    required: "Required"
    optional: "Optional"
  vi:
    title: "Xác suất và Thống kê tự học"
    description: "Khóa học Xác suất & Thống kê / thống kê tính toán. Bản tiếng Việt đủ Chương 01–08; bản tiếng Anh đang mở từ Chương 01."
    home: "Trang chủ"
    chapters: "Các chương"
    language: "Ngôn ngữ"
    switch_language: "Chuyển sang tiếng Anh"
    required: "Bắt buộc"
    optional: "Tùy chọn"
# About/contact
author:
  name:              Nguyen Le Linh
  email:             nglelinh@gmail.com
# Gems
plugins:
  - jekyll-paginate
  - jekyll-feed

plugins_dir: _plugins

# Collections for multilingual content
collections:
  posts:
    output: true
    permalink: /:categories/:title/

# English posts need a /contents/en/ URL prefix so the language switch
# can pair them with the matching Vietnamese chapter + order.
defaults:
  - scope:
      path: "contents/en"
      type: posts
    values:
      permalink: /contents/en/:categories/:name/

# Custom vars
version:             0.0.1
markdown: kramdown

# Analytics
google_analytics_id: ""
